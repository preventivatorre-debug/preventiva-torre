* {

/* =========================================================

let modoEdicao = false;

let equipamentosCadastro = [];

/* =========================================================
   NOVO ID
========================================================= */

function novoId() {

  return crypto.randomUUID();

}


/* =========================================================
   ATIVAR EDIÇÃO
========================================================= */

function ativarEdicao() {

  if (modoEdicao)
    return;


  const senha =
    prompt(
      "🔐 Digite a senha para ativar o modo edição:"
    );


  if (senha === null)
    return;


  if (senha !== SENHA_EDICAO) {

    alert(
      "❌ Senha incorreta."
    );

    return;

  }


  modoEdicao = true;


  atualizarModoEdicao();


  render();

}


/* =========================================================
   BLOQUEAR EDIÇÃO
========================================================= */

function bloquearEdicao() {

  modoEdicao = false;


  fecharCadastroEquipamentos();


  atualizarModoEdicao();


  render();

}


/* =========================================================
   ATUALIZAR INTERFACE DO MODO EDIÇÃO
========================================================= */

function atualizarModoEdicao() {

  const status =
    document.getElementById(
      "statusEdicao"
    );


  const btnEditar =
    document.getElementById(
      "btnEditar"
    );


  const btnSalvar =
    document.getElementById(
      "btnSalvar"
    );


  const btnBloquear =
    document.getElementById(
      "btnBloquear"
    );


  if (modoEdicao) {

    status.textContent =
      "🔓 MODO EDIÇÃO ATIVO";


    status.className =
      "status-edicao edicao-liberada";


    btnEditar.disabled =
      true;


    btnSalvar.disabled =
      false;


    btnBloquear.disabled =
      false;

  } else {

    status.textContent =
      "🔒 Edição bloqueada";


    status.className =
      "status-edicao edicao-bloqueada";


    btnEditar.disabled =
      false;


    btnSalvar.disabled =
      true;


    btnBloquear.disabled =
      true;

  }


  atualizarCamposEdicao();

}


/* =========================================================
   HABILITAR / DESABILITAR CAMPOS
========================================================= */

function atualizarCamposEdicao() {

  const campos =
    document.querySelectorAll(
      ".form-pop input, .form-equipamento input, .pop input"
    );


  campos.forEach(
    campo => {

      campo.disabled =
        !modoEdicao;

    }
  );


  const botoesEdicao =
    document.querySelectorAll(
      ".btn-edicao"
    );


  botoesEdicao.forEach(
    botao => {

      botao.disabled =
        !modoEdicao;

    }
  );


  const btnCriar =
    document.getElementById(
      "btnCriarPOP"
    );


  if (btnCriar)
    btnCriar.disabled =
      !modoEdicao;


  const btnCadastro =
    document.getElementById(
      "btnCadastroEquipamentos"
    );


  if (btnCadastro)
    btnCadastro.disabled =
      !modoEdicao;


  const btnCadastrarEquipamento =
    document.getElementById(
      "btnCadastrarEquipamento"
    );


  if (btnCadastrarEquipamento)
    btnCadastrarEquipamento.disabled =
      !modoEdicao;

}


/* =========================================================
   CONVERSÃO POP
========================================================= */

function popParaBanco(pop) {

  return {

    id:
      pop.id || novoId(),

    nome:
      pop.nome,

    ah:
      Number(pop.ah) || 0,

    data_instalacao:
      pop.dataInstalacao || null,

    validade:
      pop.validade || null,

    equipamentos:
      pop.equipamentos || []

  };

}


function bancoParaPop(row) {

  return {

    id:
      row.id,

    nome:
      row.nome,

    ah:
      Number(row.ah) || 0,

    dataInstalacao:
      row.data_instalacao || "",

    validade:
      row.validade || "",

    equipamentos:
      Array.isArray(row.equipamentos)
        ? row.equipamentos
        : []

  };

}

/* =========================================================
   CARREGAR EQUIPAMENTOS
========================================================= */

async function carregarEquipamentos() {

  const { data, error } =
    await supabaseClient
      .from("equipamentos_autonomia")
      .select("*")
      .order("nome", {
        ascending: true
      });


  if (error) {

    console.error(error);

    alert(
      "Erro ao carregar equipamentos: " +
      error.message
    );

    return;

  }


  equipamentosCadastro =
    data || [];


  atualizarDatalistEquipamentos();

}


/* =========================================================
   CADASTRAR EQUIPAMENTO
========================================================= */

async function cadastrarEquipamento() {

  if (!modoEdicao)
    return;


  const nome =
    document
      .getElementById(
        "novoEquipamento"
      )
      .value
      .trim();


  const modelo =
    document
      .getElementById(
        "novoModelo"
      )
      .value
      .trim();


  const ampere =
    Number(
      document
        .getElementById(
          "novoAmpere"
        )
        .value
    );


  if (!nome) {

    alert(
      "Informe o equipamento."
    );

    return;

  }


  if (isNaN(ampere)) {

    alert(
      "Informe o consumo em Ampere."
    );

    return;

  }


  const equipamento = {

    id:
      novoId(),

    nome:
      nome,

    modelo:
      modelo,

    ampere:
      ampere

  };


  const { data, error } =
    await supabaseClient
      .from(
        "equipamentos_autonomia"
      )
      .insert(
        equipamento
      )
      .select()
      .single();


  if (error) {

    console.error(error);

    alert(
      "Erro ao cadastrar equipamento: " +
      error.message
    );

    return;

  }


  equipamentosCadastro.push(
    data
  );


  document.getElementById(
    "novoEquipamento"
  ).value = "";


  document.getElementById(
    "novoModelo"
  ).value = "";


  document.getElementById(
    "novoAmpere"
  ).value = "";


  atualizarListaEquipamentos();

  atualizarDatalistEquipamentos();


  alert(
    "✅ Equipamento cadastrado."
  );

}


/* =========================================================
   EDITAR EQUIPAMENTO
========================================================= */

async function editarEquipamento(i) {

  if (!modoEdicao)
    return;


  const equipamento =
    equipamentosCadastro[i];


  if (!equipamento)
    return;


  const novoNome =
    prompt(
      "Nome do equipamento:",
      equipamento.nome
    );


  if (novoNome === null)
    return;


  const novoModelo =
    prompt(
      "Modelo / fabricante:",
      equipamento.modelo || ""
    );


  if (novoModelo === null)
    return;


  const novoAmpere =
    prompt(
      "Consumo em Ampere:",
      equipamento.ampere
    );


  if (novoAmpere === null)
    return;


  const ampere =
    Number(
      novoAmpere
        .replace(",", ".")
    );


  if (isNaN(ampere)) {

    alert(
      "Ampere inválido."
    );

    return;

  }


  const { data, error } =
    await supabaseClient
      .from(
        "equipamentos_autonomia"
      )
      .update({

        nome:
          novoNome.trim(),

        modelo:
          novoModelo.trim(),

        ampere:
          ampere

      })
      .eq(
        "id",
        equipamento.id
      )
      .select()
      .single();


  if (error) {

    alert(
      "Erro ao atualizar equipamento: " +
      error.message
    );

    return;

  }


  equipamentosCadastro[i] =
    data;


  atualizarListaEquipamentos();

  atualizarDatalistEquipamentos();

}


/* =========================================================
   EXCLUIR EQUIPAMENTO
========================================================= */

async function excluirEquipamento(i) {

  if (!modoEdicao)
    return;


  const equipamento =
    equipamentosCadastro[i];


  if (!equipamento)
    return;


  if (
    !confirm(
      "Excluir " +
      equipamento.nome +
      "?"
    )
  )
    return;


  const { error } =
    await supabaseClient
      .from(
        "equipamentos_autonomia"
      )
      .delete()
      .eq(
        "id",
        equipamento.id
      );


  if (error) {

    alert(
      "Erro ao excluir equipamento: " +
      error.message
    );

    return;

  }


  equipamentosCadastro.splice(
    i,
    1
  );


  atualizarListaEquipamentos();

  atualizarDatalistEquipamentos();

}


/* =========================================================
   LISTA EQUIPAMENTOS
========================================================= */

function atualizarListaEquipamentos() {

  const div =
    document.getElementById(
      "listaEquipamentosCadastrados"
    );


  if (!div)
    return;


  let html = `

  <h4>
    Equipamentos cadastrados
  </h4>

  <table>

  <tr>

    <th>
      Equipamento
    </th>

    <th>
      Modelo
    </th>

    <th>
      Ampere
    </th>

    <th>
      Ação
    </th>

  </tr>

  `;


  equipamentosCadastro.forEach(
    (e,i) => {

      html += `

      <tr>

        <td>
          ${escapeHtml(e.nome)}
        </td>

        <td>
          ${escapeHtml(
            e.modelo || ""
          )}
        </td>

        <td>
          ${Number(
            e.ampere
          ).toFixed(2)} A
        </td>

        <td>

          <button
            class="editar"
            onclick="
              editarEquipamento(${i})
            "
          >
            ✏️
          </button>


          <button
            class="remove"
            onclick="
              excluirEquipamento(${i})
            "
          >
            X
          </button>

        </td>

      </tr>

      `;

    }
  );


  html += `
  </table>
  `;


  div.innerHTML =
    html;

}


/* =========================================================
   DATAlIST
========================================================= */

function atualizarDatalistEquipamentos() {

  let lista =
    document.getElementById(
      "listaEquipamentos"
    );


  if (!lista) {

    lista =
      document.createElement(
        "datalist"
      );


    lista.id =
      "listaEquipamentos";


    document.body.appendChild(
      lista
    );

  }


  lista.innerHTML = "";


  equipamentosCadastro.forEach(
    equipamento => {

      const option =
        document.createElement(
          "option"
        );


      option.value =
        equipamento.nome;


      option.label =
        `${equipamento.nome} - ${
          equipamento.modelo || ""
        } - ${
          Number(
            equipamento.ampere
          ).toFixed(2)
        } A`;


      lista.appendChild(
        option
      );

    }
  );

}


/* =========================================================
   ENCONTRAR EQUIPAMENTO
========================================================= */

function encontrarEquipamento(nome) {

  const texto =
    String(nome || "")
      .trim()
      .toLowerCase();


  return equipamentosCadastro.find(
    e =>
      String(e.nome)
        .trim()
        .toLowerCase() ===
      texto
  );

}


/* =========================================================
   PREENCHIMENTO AUTOMÁTICO
========================================================= */

function preencherEquipamento(
  popIndex,
  equipamentoIndex,
  input
) {

  if (!modoEdicao)
    return;


  const encontrado =
    encontrarEquipamento(
      input.value
    );


  if (!encontrado) {

    alert(
      "⚠️ Equipamento não encontrado no cadastro global."
    );

    return;

  }


  const equipamento =
    pops[popIndex]
      .equipamentos[
        equipamentoIndex
      ];


  equipamento[0] =
    encontrado.nome;


  equipamento[1] =
    encontrado.modelo || "";


  equipamento[2] =
    Number(
      encontrado.ampere
    ) || 0;


  salvarPOP(
    pops[popIndex]
  );


  renderVisivel(
    popIndex
  );

}


/* =========================================================
   RENDER
========================================================= */

function render() {

  const c =
    document.getElementById(
      "pops"
    );


  c.innerHTML = "";


  pops.forEach(
    (pop,i) => {

      let consumo = 0;

      let linhas = "";


      pop.equipamentos.forEach(
        (e,j) => {

          consumo +=
            (
              Number(e[2]) || 0
            ) *
            (
              Number(e[3]) || 0
            );


          linhas += `

          <tr>

          <td>

          <input

            value="${escapeHtml(
              e[0]
            )}"

            list="listaEquipamentos"

            placeholder="Digite o equipamento"

            ${!modoEdicao ? "disabled" : ""}

            onchange="
              preencherEquipamento(
                ${i},
                ${j},
                this
              );
            "

          >

          </td>


          <td>

          <input

            value="${escapeHtml(
              e[1]
            )}"

            readonly

            title="Preenchido pelo cadastro"

          >

          </td>


          <td>

          <input

            type="number"

            step="0.01"

            value="${e[2]}"

            ${!modoEdicao ? "disabled" : ""}

            onchange="

              pops[${i}]
                .equipamentos[${j}][2]
                = Number(this.value);

              salvarPOP(
                pops[${i}]
              );

              renderVisivel(${i});

            "

          >

          </td>


          <td>

          <input

            type="number"

            step="1"

            min="1"

            value="${e[3]}"

            ${!modoEdicao ? "disabled" : ""}

            onchange="

              pops[${i}]
                .equipamentos[${j}][3]
                = Number(this.value);

              salvarPOP(
                pops[${i}]
              );

              renderVisivel(${i});

            "

          >

          </td>


          <td>

          <button

            class="remove btn-edicao"

            ${!modoEdicao ? "disabled" : ""}

            onclick="

              pops[${i}]
                .equipamentos
                .splice(${j},1);

              salvarPOP(
                pops[${i}]
              );

              render();

            "

          >
            X
          </button>

          </td>


          </tr>

          `;

        }
      );


      const horas =
        consumo > 0
          ? Number(pop.ah) /
            consumo
          : 0;


      const h =
        Math.floor(horas);


      const m =
        Math.round(
          (
            horas - h
          ) * 60
        );


      const status =
        statusBateria(
          pop.validade
        );


      c.innerHTML += `

      <div

        class="pop"

        data-nome="${escapeHtml(
          pop.nome.toLowerCase()
        )}"

      >


      <div class="nome-pop-edicao">

      <label>
        <strong>
          Nome do POP
        </strong>
      </label>


      <input

        type="text"

        value="${escapeHtml(
          pop.nome
        )}"

        ${!modoEdicao ? "disabled" : ""}

        onchange="

          pops[${i}].nome =
            this.value.trim();

          salvarPOP(
            pops[${i}]
          );

        "

      >

      </div>


      <!-- BANCO -->

      <div class="banco">

      <h3>
        🔋 Banco de Baterias
      </h3>


      <div class="banco-grid">


      <div>

      <label>
        Capacidade do Banco
      </label>


      <input

        type="number"

        step="0.01"

        value="${pop.ah}"

        ${!modoEdicao ? "disabled" : ""}

        onchange="

          pops[${i}].ah =
            Number(this.value);

          salvarPOP(
            pops[${i}]
          );

          renderVisivel(${i});

        "

      >


      <small>
        Ah
      </small>

      </div>


      <div>

      <label>
        Data de Instalação
      </label>


      <input

        type="date"

        value="${
          pop.dataInstalacao || ""
        }"

        ${!modoEdicao ? "disabled" : ""}

        onchange="

          pops[${i}]
            .dataInstalacao =
            this.value;

          salvarPOP(
            pops[${i}]
          );

        "

      >

      </div>


      <div>

      <label>
        Data de Validade
      </label>


      <input

        type="date"

        value="${
          pop.validade || ""
        }"

        ${!modoEdicao ? "disabled" : ""}

        onchange="

          pops[${i}]
            .validade =
            this.value;

          salvarPOP(
            pops[${i}]
          );

          renderVisivel(${i});

        "

      >

      </div>


      <div>

      <label>
        Situação
      </label>


      <div
        class="status ${status.classe}"
      >

        ${status.texto}

      </div>

      </div>


      </div>


      <div class="info">

        📅 Instalação:

        <strong>
          ${formatarData(
            pop.dataInstalacao
          )}
        </strong>

        &nbsp;&nbsp;

        📅 Validade:

        <strong>
          ${formatarData(
            pop.validade
          )}
        </strong>

      </div>


      </div>


      <!-- EQUIPAMENTOS -->

      <h3>
        📡 Equipamentos
      </h3>


      <table>

      <tr>

      <th>
        Equipamento
      </th>

      <th>
        Modelo
      </th>

      <th>
        Ampere
      </th>

      <th>
        Qt
      </th>

      <th>
      </th>

      </tr>


      ${linhas}


      <tr class="total">

      <td colspan="2">
        Consumo Total
      </td>

      <td colspan="3">

        ${consumo.toFixed(2)}
        A

      </td>

      </tr>


      </table>


      <button

        class="btn-edicao"

        ${!modoEdicao ? "disabled" : ""}

        onclick="

          pops[${i}]
            .equipamentos
            .push(['','',0,1]);

          salvarPOP(
            pops[${i}]
          );

          renderVisivel(${i});

        "

      >

        ➕ Adicionar Equipamento

      </button>


      <div class="info">

        🔋 Banco:

        <strong>
          ${Number(
            pop.ah
          ).toFixed(2)}
          Ah
        </strong>


        &nbsp;&nbsp;


        ⚡ Consumo:

        <strong>
          ${consumo.toFixed(2)}
          A
        </strong>


        &nbsp;&nbsp;


        ⏱️ Autonomia:

        <span class="autonomia">

          ${h}h ${m}min

        </span>

      </div>


      <button

        class="remove btn-edicao"

        ${!modoEdicao ? "disabled" : ""}

        onclick="
          excluirPOP(${i})
        "

      >

        🗑️ Excluir POP

      </button>


      </div>

      `;

    }
  );


  atualizarListaPOPs();

  atualizarCamposEdicao();

}


/* =========================================================
   RENDER VISÍVEL
========================================================= */

function renderVisivel(i) {

  render();


  const tela =
    document.querySelectorAll(
      ".pop"
    );


  if (tela[i]) {

    tela[i].style.display =
      "block";

  }

}


/* =========================================================
   CRIAR POP
========================================================= */

async function criarPOP() {

  if (!modoEdicao)
    return;


  const nome =
    document.getElementById(
      "novoNome"
    ).value.trim();


  const ah =
    document.getElementById(
      "novoAh"
    ).value;


  const data =
    document.getElementById(
      "novaData"
    ).value;


  const validade =
    document.getElementById(
      "novaValidade"
    ).value;


  if (!nome || !ah) {

    alert(
      "Preencha o nome do POP e o banco."
    );

    return;

  }


  const novoPOP = {

    id:
      novoId(),

    nome:
      nome,

    ah:
      Number(ah),

    dataInstalacao:
      data,

    validade:
      validade,

    equipamentos:
      []

  };


  pops.push(
    novoPOP
  );


  await salvarPOP(
    novoPOP
  );


  document.getElementById(
    "novoNome"
  ).value = "";


  document.getElementById(
    "novoAh"
  ).value = "";


  document.getElementById(
    "novaData"
  ).value = "";


  document.getElementById(
    "novaValidade"
  ).value = "";


  render();

}


/* =========================================================
   EXCLUIR POP
========================================================= */

async function excluirPOP(i) {

  if (!modoEdicao)
    return;


  const pop =
    pops[i];


  if (!pop)
    return;


  if (
    !confirm(
      "Deseja excluir este POP?"
    )
  )
    return;


  const { error } =
    await supabaseClient
      .from(
        "pops_autonomia"
      )
      .delete()
      .eq(
        "id",
        pop.id
      );


  if (error) {

    alert(
      "Erro ao excluir POP: " +
      error.message
    );

    return;

  }


  pops.splice(
    i,
    1
  );


  render();

}


/* =========================================================
   SALVAR POP
========================================================= */

async function salvarPOP(pop) {

  const registro =
    popParaBanco(
      pop
    );


  const { error } =
    await supabaseClient
      .from(
        "pops_autonomia"
      )
      .upsert(
        registro,
        {
          onConflict: "id"
        }
      );


  if (error) {

    console.error(
      error
    );

    alert(
      "Erro ao salvar: " +
      error.message
    );

  }

}


/* =========================================================
   SALVAR TUDO
========================================================= */

async function salvarTudo() {

  if (!modoEdicao)
    return;


  const btn =
    document.getElementById(
      "btnSalvar"
    );


  btn.disabled = true;

  btn.textContent =
    "💾 Salvando...";


  try {

    for (
      const pop
      of pops
    ) {

      const registro =
        popParaBanco(
          pop
        );


      const { error } =
        await supabaseClient
          .from(
            "pops_autonomia"
          )
          .upsert(
            registro,
            {
              onConflict: "id"
            }
          );


      if (error)
        throw error;

    }


    alert(
      "✅ Todas as alterações foram salvas no banco."
    );


  } catch (error) {

    console.error(
      error
    );

    alert(
      "❌ Erro ao salvar: " +
      error.message
    );

  }


  btn.disabled =
    false;

  btn.textContent =
    "💾 Salvar Alterações";

}


/* =========================================================
   STATUS BATERIA
========================================================= */

function statusBateria(
  validade
) {

  if (!validade) {

    return {

      texto:
        "⚪ Sem validade cadastrada",

      classe:
        ""

    };

  }


  const hoje =
    new Date();


  hoje.setHours(
    0,
    0,
    0,
    0
  );


  const dataValidade =
    new Date(
      validade +
      "T00:00:00"
    );


  const diferenca =
    Math.ceil(
      (
        dataValidade -
        hoje
      ) /
      (
        1000 *
        60 *
        60 *
        24
      )
    );


  if (
    diferenca < 0
  ) {

    return {

      texto:
        "🔴 BATERIA FORA DA GARANTIA",

      classe:
        "status-vencida"

    };

  }


  if (
    diferenca <= 90
  ) {

    return {

      texto:
        `🟡 Vence em ${diferenca} dias`,

      classe:
        "status-alerta"

    };

  }


  return {

    texto:
      "🟢 Bateria dentro da Garantia",

    classe:
      "status-ok"

  };

}


/* =========================================================
   FORMATAR DATA
========================================================= */

function formatarData(
  data
) {

  if (!data)
    return "--";


  const partes =
    data.split("-");


  if (
    partes.length !== 3
  )
    return data;


  return `${partes[2]}/${partes[1]}/${partes[0]}`;

}


/* =========================================================
   LISTA POPS
========================================================= */

function atualizarListaPOPs() {

  const lista =
    document.getElementById(
      "listaPOPs"
    );


  if (!lista)
    return;


  lista.innerHTML =
    "";


  pops
    .slice()
    .sort(
      (a,b) =>
        a.nome.localeCompare(
          b.nome,
          "pt-BR"
        )
    )
    .forEach(
      pop => {

        const option =
          document.createElement(
            "option"
          );


        option.value =
          pop.nome;


        lista.appendChild(
          option
        );

      }
    );

}


/* =========================================================
   BUSCAR POP
========================================================= */

function buscarPOP() {

  const campo =
    document.getElementById(
      "busca"
    );


  const texto =
    campo.value
      .trim()
      .toLowerCase();


  document
    .querySelectorAll(
      ".pop"
    )
    .forEach(
      p => {

        if (
          texto &&
          p.dataset.nome
            .includes(
              texto
            )
        ) {

          p.style.display =
            "block";

        } else {

          p.style.display =
            "none";

        }

      }
    );

}


/* =========================================================
   ABRIR CADASTRO
========================================================= */

function abrirCadastroEquipamentos() {

  if (!modoEdicao)
    return;


  document.getElementById(
    "cadastroEquipamentos"
  ).style.display =
    "block";


  atualizarListaEquipamentos();

}


/* =========================================================
   FECHAR CADASTRO
========================================================= */

function fecharCadastroEquipamentos() {

  document.getElementById(
    "cadastroEquipamentos"
  ).style.display =
    "none";

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(
  text
) {

  return String(
    text || ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


/* =========================================================
   CARREGAR POPS
========================================================= */

async function carregarDados() {

  const { data, error } =
    await supabaseClient
      .from(
        "pops_autonomia"
      )
      .select("*")
      .order(
        "nome",
        {
          ascending:
            true
        }
      );


  if (error) {

    console.error(
      error
    );

    alert(
      "Erro ao carregar POPs: " +
      error.message
    );

    return;

  }


  if (
    data &&
    data.length > 0
  ) {

    pops =
      data.map(
        bancoParaPop
      );

  } else {

    pops =
      popsPadrao.map(
        pop => ({

          ...pop,

          id:
            novoId()

        })
      );


    const { error:
      insertError
    } =
      await supabaseClient
        .from(
          "pops_autonomia"
        )
        .insert(
          pops.map(
            popParaBanco
          )
        );


    if (insertError) {

      console.error(
        insertError
      );

      alert(
        "Erro ao criar POPs padrão: " +
        insertError.message
      );

      return;

    }

  }


  render();

}


/* =========================================================
   INICIALIZAR
========================================================= */

async function iniciar() {

  await carregarEquipamentos();

  await carregarDados();

  modoEdicao =
    false;

  atualizarModoEdicao();

}


iniciar();

</script>


<script>

(async function () {

  if (
    "serviceWorker"
    in navigator
  ) {

    const registrations =
      await navigator
        .serviceWorker
        .getRegistrations();


    for (
      const registration
      of registrations
    ) {

      await registration
        .unregister();

    }

  }


  if (
    "caches"
    in window
  ) {

    const nomes =
      await caches.keys();


    for (
      const nome
      of nomes
    ) {

      await caches.delete(
        nome
      );

    }

  }


  console.log(
    "✅ Service Worker removido. Sistema sem cache."
  );

})();

</script>
