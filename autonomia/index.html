<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Controle de POPs - Autonomia</title>

<link rel="manifest" href="./manifest.json">

<meta name="theme-color" content="#1f6f43">

<style>

* {
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #f2f4f6;
  padding: 20px;
  margin: 0;
}

h1 {
  text-align: center;
  color: #1f6f43;
}

.topo {
  max-width: 1400px;
  margin: auto;
}

.controle-edicao {
  background: white;
  padding: 12px;
  border-radius: 8px;
  margin-bottom: 15px;
  box-shadow: 0 2px 6px rgba(0,0,0,.1);

  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
}

.status-edicao {
  padding: 8px 12px;
  border-radius: 6px;
  font-weight: bold;
}

.edicao-bloqueada {
  background: #f8d7da;
  color: #721c24;
}

.edicao-liberada {
  background: #d4edda;
  color: #155724;
}

.busca-container {
  width: 100%;
  margin-bottom: 15px;
}

#busca {
  width: 100%;
  padding: 12px;
  font-size: 16px;
  border: 1px solid #ccc;
  border-radius: 6px;
}

.resumo {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-bottom: 20px;
}

.resumo-card {
  background: white;
  padding: 15px;
  border-radius: 8px;
  box-shadow: 0 2px 6px rgba(0,0,0,.1);
  text-align: center;
}

.resumo-card strong {
  display: block;
  font-size: 25px;
  margin-top: 5px;
}

.resumo-ok {
  border-left: 5px solid #28a745;
}

.resumo-alerta {
  border-left: 5px solid #f0ad4e;
}

.resumo-vencida {
  border-left: 5px solid #dc3545;
}

.form-pop,
.form-equipamento {
  background: #fff;
  padding: 15px;
  border-radius: 8px;
  margin-bottom: 20px;
  box-shadow: 0 2px 6px rgba(0,0,0,.1);
}

.form-pop input,
.form-equipamento input {
  padding: 9px;
  margin: 4px;
  border: 1px solid #ccc;
  border-radius: 5px;
}

input {
  width: 95%;
  padding: 7px;
  border: 1px solid #ccc;
  border-radius: 4px;
}

input:disabled {
  background: #eeeeee;
  cursor: not-allowed;
}

button {
  padding: 8px 12px;
  border: none;
  background: #1f6f43;
  color: #fff;
  cursor: pointer;
  border-radius: 5px;
  margin-top: 5px;
}

button:hover {
  opacity: .9;
}

button:disabled {
  background: #999;
  cursor: not-allowed;
}

.remove {
  background: #c0392b;
}

.editar {
  background: #2980b9;
}

.salvar {
  background: #1769aa;
  font-weight: bold;
}

.bloquear {
  background: #555;
}

.pop {
  display: none;
  background: #fff;
  border-radius: 8px;
  padding: 15px;
  margin-bottom: 25px;
  box-shadow: 0 2px 6px rgba(0,0,0,.1);
}

.nome-pop-edicao {
  margin-bottom: 15px;
}

.nome-pop-edicao label {
  display: block;
  margin-bottom: 5px;
  color: #1f6f43;
}

.nome-pop-edicao input {
  width: 100%;
  font-size: 18px;
  font-weight: bold;
}

.banco {
  margin-top: 15px;
  padding: 15px;
  background: #eef8f2;
  border-left: 5px solid #1f6f43;
  border-radius: 6px;
}

.banco-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}

.banco label,
.preventiva label {
  font-weight: bold;
  display: block;
  margin-bottom: 5px;
}

.preventiva {
  margin-top: 15px;
  padding: 15px;
  background: #f5f8ff;
  border-left: 5px solid #2980b9;
  border-radius: 6px;
}

.preventiva-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}

.status {
  font-weight: bold;
  padding: 9px;
  border-radius: 5px;
  text-align: center;
}

.status-ok {
  background: #d4edda;
  color: #155724;
}

.status-alerta {
  background: #fff3cd;
  color: #856404;
}

.status-vencida {
  background: #f8d7da;
  color: #721c24;
}

.status-sem {
  background: #eeeeee;
  color: #666;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
}

th,
td {
  border: 1px solid #ccc;
  padding: 7px;
  text-align: center;
}

th {
  background: #e7f3ec;
}

.total {
  background: #fff3a0;
  font-weight: bold;
}

.info {
  margin-top: 15px;
  padding: 12px;
  background: #f7f7f7;
  border-radius: 6px;
  line-height: 1.7;
}

.autonomia {
  font-size: 18px;
  font-weight: bold;
  color: #1f6f43;
}

.cadastro-equipamentos {
  display: none;
}

@media(max-width:900px) {

  .resumo {
    grid-template-columns: 1fr 1fr;
  }

  .banco-grid,
  .preventiva-grid {
    grid-template-columns: 1fr 1fr;
  }

}

@media(max-width:500px) {

  .resumo {
    grid-template-columns: 1fr;
  }

  .banco-grid,
  .preventiva-grid {
    grid-template-columns: 1fr;
  }

  .form-pop input,
  .form-equipamento input {
    width: 100%;
    margin: 4px 0;
  }

}

</style>

</head>


<body>

<div class="topo">


<h1>
🔋 Controle de Autonomia dos POPs
</h1>

CONTROLE DE EDIÇÃO

RESUMO PREVENTIVAS

NOVO POP

</h3>

id="novoNome"

>

id="novoAh"

step="0.01"

disabled
>

>

id="novaValidade"

<button

disabled

<!-- =====================================================

<div

>

<h3>

disabled
>

id="novoModelo"

disabled
>

<input
id="novoAmpere"
type="number"
step="0.01"
placeholder="Consumo em Ampere"
disabled
>

<button

onclick="cadastrarEquipamento()"
disabled

➕ Cadastrar Equipamento

<div id="pops"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================================================
SUPABASE
========================================================= */

const SUPABASE_URL =
"https://idzteltrnttmwzqjlkgj.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_R4WcR-nhwErOjdW-cByXmw_RCGI4aix";

const SENHA_EDICAO =
"8Hgkg77d6f";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);


/* =========================================================
VARIÁVEIS
========================================================= */

let modoEdicao = false;

let pops = [];

let equipamentosCadastro = [];


/* =========================================================
ID
========================================================= */

function novoId() {

return crypto.randomUUID();

}


/* =========================================================
MODO EDIÇÃO
========================================================= */

function ativarEdicao() {

const senha =
prompt(
"🔐 Digite a senha para ativar o modo edição:"
);

if (senha === null)
return;

if (senha !== SENHA_EDICAO) {

alert("❌ Senha incorreta.");

return;

}

modoEdicao = true;

atualizarModoEdicao();

render();

}


function bloquearEdicao() {

modoEdicao = false;

fecharCadastroEquipamentos();

atualizarModoEdicao();

render();

}


function atualizarModoEdicao() {

const status =
document.getElementById(
"statusEdicao"
);

const btnEditar =
document.getElementById(
"btnEditar"
);

const btnSalvar =
document.getElementById(
"btnSalvar"
);

const btnBloquear =
document.getElementById(
"btnBloquear"
);


if (modoEdicao) {

status.textContent =
"🔓 MODO EDIÇÃO ATIVO";

status.className =
"status-edicao edicao-liberada";

btnEditar.disabled = true;

btnSalvar.disabled = false;

btnBloquear.disabled = false;

} else {

status.textContent =
"🔒 Edição bloqueada";

status.className =
"status-edicao edicao-bloqueada";

btnEditar.disabled = false;

btnSalvar.disabled = true;

btnBloquear.disabled = true;

}

atualizarCampos();

}


function atualizarCampos() {

document
.querySelectorAll(
"input"
)
.forEach(
campo => {

if (
campo.id === "busca"
)
return;

campo.disabled =
!modoEdicao;

}
);

document
.querySelectorAll(
".btn-edicao"
)
.forEach(
botao => {

botao.disabled =
!modoEdicao;

}
);

}


/* =========================================================
BANCO
========================================================= */

function popParaBanco(pop) {

return {

id: pop.id,

nome: pop.nome,

ah: Number(pop.ah) || 0,

data_instalacao:
pop.dataInstalacao || null,

validade:
pop.validade || null,

ultima_preventiva:
pop.ultimaPreventiva || null,

proxima_preventiva:
pop.proximaPreventiva || null,

periodicidade_preventiva:
Number(
pop.periodicidadePreventiva
) || 30,

equipamentos:
pop.equipamentos || []

};

}


function bancoParaPop(row) {

return {

id: row.id,

nome: row.nome,

ah: Number(row.ah) || 0,

dataInstalacao:
row.data_instalacao || "",

validade:
row.validade || "",

ultimaPreventiva:
row.ultima_preventiva || "",

proximaPreventiva:
row.proxima_preventiva || "",

periodicidadePreventiva:
Number(
row.periodicidade_preventiva
) || 30,

equipamentos:
Array.isArray(row.equipamentos)
? row.equipamentos
: []

};

}


/* =========================================================
CALCULAR PRÓXIMA PREVENTIVA
========================================================= */

function calcularProximaPreventiva(
data,
dias
) {

if (!data)
return "";

dias =
Number(dias) || 30;

const partes =
data.split("-");

const dataObj =
new Date(
Number(partes[0]),
Number(partes[1]) - 1,
Number(partes[2])
);

dataObj.setDate(
dataObj.getDate() + dias
);

const ano =
dataObj.getFullYear();

const mes =
String(
dataObj.getMonth() + 1
).padStart(2,"0");

const dia =
String(
dataObj.getDate()
).padStart(2,"0");

return `${ano}-${mes}-${dia}`;

}


/* =========================================================
STATUS PREVENTIVA
========================================================= */

function statusPreventiva(pop) {

if (!pop.proximaPreventiva) {

return {

texto:
"⚪ Preventiva não cadastrada",

classe:
"status-sem",

tipo:
"sem"

};

}


const hoje =
new Date();

hoje.setHours(
0,0,0,0
);


const proxima =
new Date(
pop.proximaPreventiva +
"T00:00:00"
);


const dias =
Math.ceil(
(
proxima - hoje
) /
(
1000 *
60 *
60 *
24
)
);


if (dias < 0) {

return {

texto:
`🔴 PREVENTIVA VENCIDA há ${Math.abs(dias)} dias`,

classe:
"status-vencida",

tipo:
"vencida"

};

}


if (dias <= 7) {

return {

texto:
`🟡 Preventiva vence em ${dias} dias`,

classe:
"status-alerta",

tipo:
"alerta"

};

}


return {

texto:
`🟢 Preventiva em dia — ${dias} dias`,

classe:
"status-ok",

tipo:
"ok"

};

}


/* =========================================================
EQUIPAMENTOS
========================================================= */

async function carregarEquipamentos() {

const { data, error } =
await supabaseClient
.from(
"equipamentos_autonomia"
)
.select("*")
.order(
"nome",
{
ascending:true
}
);

if (error) {

console.error(error);

alert(
"Erro ao carregar equipamentos: " +
error.message
);

return;

}

equipamentosCadastro =
data || [];

}


async function cadastrarEquipamento() {

if (!modoEdicao)
return;

const nome =
document
.getElementById(
"novoEquipamento"
)
.value
.trim();

const modelo =
document
.getElementById(
"novoModelo"
)
.value
.trim();

const ampere =
Number(
document
.getElementById(
"novoAmpere"
)
.value
);

if (!nome) {

alert(
"Informe o equipamento."
);

return;

}

const { data, error } =
await supabaseClient
.from(
"equipamentos_autonomia"
)
.insert({

nome,
modelo,
ampere

})
.select()
.single();

if (error) {

alert(
"Erro ao cadastrar equipamento: " +
error.message
);

return;

}

equipamentosCadastro.push(
data
);

document.getElementById(
"novoEquipamento"
).value = "";

document.getElementById(
"novoModelo"
).value = "";

document.getElementById(
"novoAmpere"
).value = "";

atualizarListaEquipamentos();

}


function encontrarEquipamento(nome) {

return equipamentosCadastro.find(
e =>
String(e.nome)
.trim()
.toLowerCase() ===
String(nome)
.trim()
.toLowerCase()
);

}


function preencherEquipamento(
i,
j,
input
) {

if (!modoEdicao)
return;

const encontrado =
encontrarEquipamento(
input.value
);

if (!encontrado)
return;

pops[i]
.equipamentos[j][0] =
encontrado.nome;

pops[i]
.equipamentos[j][1] =
encontrado.modelo || "";

pops[i]
.equipamentos[j][2] =
Number(encontrado.ampere) || 0;

salvarPOP(
pops[i]
);

renderVisivel(i);

}


function atualizarListaEquipamentos() {

const div =
document.getElementById(
"listaEquipamentosCadastrados"
);

if (!div)
return;

let html = `

<h4>
Equipamentos cadastrados
</h4>

<table>

<tr>

<th>
Equipamento
</th>

<th>
Modelo
</th>

<th>
Ampere
</th>

</tr>
`;

equipamentosCadastro.forEach(
e => {

html += `

<tr>

<td>
${escapeHtml(e.nome)}
</td>

<td>
${escapeHtml(e.modelo || "")}
</td>

<td>
${Number(e.ampere).toFixed(2)} A
</td>

</tr>

`;

}
);

html += `
</table>
`;

div.innerHTML =
html;

}


/* =========================================================
RENDER
========================================================= */

function render() {

const c =
document.getElementById(
"pops"
);

c.innerHTML = "";

let ok = 0;

let alerta = 0;

let vencida = 0;


pops.forEach(
(pop,i) => {

const status =
statusPreventiva(pop);

if (
status.tipo === "ok"
) ok++;

if (
status.tipo === "alerta"
) alerta++;

if (
status.tipo === "vencida"
) vencida++;


let consumo = 0;

let linhas = "";


pop.equipamentos.forEach(
(e,j) => {

consumo +=
(Number(e[2]) || 0) *
(Number(e[3]) || 0);


linhas += `

<tr>

<td>

<input

value="${escapeHtml(e[0])}"

list="listaEquipamentos"

placeholder="Digite o equipamento"

${!modoEdicao ? "disabled" : ""}

onchange="
preencherEquipamento(
${i},
${j},
this
)
"

>

</td>


<td>

<input

value="${escapeHtml(e[1])}"

readonly

>

</td>


<td>

<input

type="number"

step="0.01"

value="${e[2]}"

${!modoEdicao ? "disabled" : ""}

onchange="

pops[${i}]
.equipamentos[${j}][2]
=
Number(this.value);

salvarPOP(
pops[${i}]
);

renderVisivel(${i});

"

>

</td>


<td>

<input

type="number"

min="1"

value="${e[3]}"

${!modoEdicao ? "disabled" : ""}

onchange="

pops[${i}]
.equipamentos[${j}][3]
=
Number(this.value);

salvarPOP(
pops[${i}]
);

renderVisivel(${i});

"

>

</td>


<td>

<button

class="remove btn-edicao"

${!modoEdicao ? "disabled" : ""}

onclick="

pops[${i}]
.equipamentos
.splice(${j},1);

salvarPOP(
pops[${i}]
);

render();

"

>

X

</button>

</td>

</tr>

`;

}
);


const horas =
consumo > 0
?
Number(pop.ah) /
consumo
:
0;

const h =
Math.floor(horas);

const m =
Math.round(
(horas - h) * 60
);


c.innerHTML += `

<div
class="pop"
data-nome="${escapeHtml(
pop.nome.toLowerCase()
)}"
>


<div class="nome-pop-edicao">

<label>
<strong>
Nome do POP
</strong>
</label>

<input

value="${escapeHtml(
pop.nome
)}"

${!modoEdicao ? "disabled" : ""}

onchange="

pops[${i}].nome =
this.value.trim();

salvarPOP(
pops[${i}]
);

"

>

</div>


<!-- BANCO -->

<div class="banco">

<h3>
🔋 Banco de Baterias
</h3>


<div class="banco-grid">


<div>

<label>
Capacidade
</label>

<input

type="number"

step="0.01"

value="${pop.ah}"

${!modoEdicao ? "disabled" : ""}

onchange="

pops[${i}].ah =
Number(this.value);

salvarPOP(
pops[${i}]
);

renderVisivel(${i});

"

>

<small>
Ah
</small>

</div>


<div>

<label>
Data de Instalação
</label>

<input

type="date"

value="${pop.dataInstalacao}"

${!modoEdicao ? "disabled" : ""}

onchange="

pops[${i}]
.dataInstalacao =
this.value;

salvarPOP(
pops[${i}]
);

"

>

</div>


<div>

<label>
Validade
</label>

<input

type="date"

value="${pop.validade}"

${!modoEdicao ? "disabled" : ""}

onchange="

pops[${i}]
.validade =
this.value;

salvarPOP(
pops[${i}]
);

renderVisivel(${i});

"

>

</div>


<div>

<label>
Situação
</label>

<div class="status ${
statusBateria(
pop.validade
).classe
}">

${statusBateria(
pop.validade
).texto}

</div>

</div>


</div>

</div>


<!-- PREVENTIVA -->

<div class="preventiva">

<h3>
🔧 Controle de Preventiva
</h3>


<div class="preventiva-grid">


<div>

<label>
Última Preventiva
</label>

<input

type="date"

value="${pop.ultimaPreventiva || ""}"

${!modoEdicao ? "disabled" : ""}

onchange="

pops[${i}]
.ultimaPreventiva =
this.value;

pops[${i}]
.proximaPreventiva =
calcularProximaPreventiva(
this.value,
pops[${i}]
.periodicidadePreventiva
);

salvarPOP(
pops[${i}]
);

renderVisivel(${i});

"

>

</div>


<div>

/* =========================================================
LISTA EQUIPAMENTOS PARA O INPUT
========================================================= */

function criarListaEquipamentos() {

let lista =
document.getElementById(
"listaEquipamentos"
);

if (!lista) {

lista =
document.createElement(
"datalist"
);

lista.id =
"listaEquipamentos";

document.body.appendChild(
lista
);

}

lista.innerHTML = "";

equipamentosCadastro.forEach(
e => {

const option =
document.createElement(
"option"
);

option.value =
e.nome;

lista.appendChild(
option
);

}
);

}


/* =========================================================
STATUS BATERIA
========================================================= */

function statusBateria(
validade
) {

if (!validade) {

return {

texto:
"⚪ Sem validade cadastrada",

classe:
"status-sem"

};

}

const hoje =
new Date();

hoje.setHours(
0,0,0,0
);

const data =
new Date(
validade +
"T00:00:00"
);

const dias =
Math.ceil(
(data - hoje) /
86400000
);

if (dias < 0) {

return {

texto:
"🔴 BATERIA FORA DA GARANTIA",

classe:
"status-vencida"

};

}

if (dias <= 90) {

return {

texto:
`🟡 Vence em ${dias} dias`,

classe:
"status-alerta"

};

}

return {

texto:
"🟢 Bateria dentro da Garantia",

classe:
"status-ok"

};

}


/* =========================================================
SALVAR POP
========================================================= */

async function salvarPOP(pop) {

const registro =
popParaBanco(pop);

const { error } =
await supabaseClient
.from(
"pops_autonomia"
)
.upsert(
registro,
{
onConflict:"id"
}
);

if (error) {

console.error(
error
);

alert(
"Erro ao salvar: " +
error.message
);

}

}


/* =========================================================
SALVAR TUDO
========================================================= */

async function salvarTudo() {

if (!modoEdicao)
return;

const btn =
document.getElementById(
"btnSalvar"
);

btn.disabled = true;

btn.textContent =
"💾 Salvando...";

try {

for (
const pop of pops
) {

const { error } =
await supabaseClient
.from(
"pops_autonomia"
)
.upsert(
popParaBanco(pop),
{
onConflict:"id"
}
);

if (error)
throw error;

}

alert(
"✅ Todas as alterações foram salvas."
);

}
catch(error) {

alert(
"❌ Erro ao salvar: " +
error.message
);

}

btn.disabled = false;

btn.textContent =
"💾 Salvar Alterações";

}


/* =========================================================
CRIAR POP
========================================================= */

async function criarPOP() {

if (!modoEdicao)
return;

const nome =
document.getElementById(
"novoNome"
).value.trim();

const ah =
Number(
document.getElementById(
"novoAh"
).value
);

const data =
document.getElementById(
"novaData"
).value;

const validade =
document.getElementById(
"novaValidade"
).value;

if (!nome || !ah) {

alert(
"Informe o nome e o banco."
);

return;

}

const novoPOP = {

id: novoId(),

nome,

ah,

dataInstalacao:
data,

validade,

ultimaPreventiva:
"",

proximaPreventiva:
"",

periodicidadePreventiva:
30,

equipamentos:
[]

};

pops.push(
novoPOP
);

await salvarPOP(
novoPOP
);

document.getElementById(
"novoNome"
).value = "";

document.getElementById(
"novoAh"
).value = "";

document.getElementById(
"novaData"
).value = "";

document.getElementById(
"novaValidade"
).value = "";

render();

}


/* =========================================================
EXCLUIR POP
========================================================= */

async function excluirPOP(i) {

if (!modoEdicao)
return;

const pop =
pops[i];

if (!confirm(
"Deseja excluir este POP?"
))
return;

const { error } =
await supabaseClient
.from(
"pops_autonomia"
)
.delete()
.eq(
"id",
pop.id
);

if (error) {

alert(
"Erro ao excluir: " +
error.message
);

return;

}

pops.splice(
i,
1
);

render();

}


/* =========================================================
CARREGAR POPS
========================================================= */

async function carregarDados() {

const { data, error } =
await supabaseClient
.from(
"pops_autonomia"
)
.select("*")
.order(
"nome",
{
ascending:true
}
);

if (error) {

alert(
"Erro ao carregar POPs: " +
error.message
);

return;

}

pops =
(data || []).map(
bancoParaPop
);

render();

}


/* =========================================================
LISTA POPS
========================================================= */

function atualizarListaPOPs() {

const lista =
document.getElementById(
"listaPOPs"
);

lista.innerHTML = "";

pops
.slice()
.sort(
(a,b) =>
a.nome.localeCompare(
b.nome,
"pt-BR"
)
)
.forEach(
pop => {

const option =
document.createElement(
"option"
);

option.value =
pop.nome;

lista.appendChild(
option
);

}
);

}


/* =========================================================
BUSCAR
========================================================= */

function buscarPOP() {

const texto =
document.getElementById(
"busca"
)
.value
.trim()
.toLowerCase();

document
.querySelectorAll(
".pop"
)
.forEach(
p => {

p.style.display =
texto &&
p.dataset.nome.includes(
texto
)
?
"block"
:
"none";

}
);

}


/* =========================================================
CADASTRO EQUIPAMENTOS
========================================================= */

function abrirCadastroEquipamentos() {

if (!modoEdicao)
return;

document.getElementById(
"cadastroEquipamentos"
).style.display =
"block";

atualizarListaEquipamentos();

}


function fecharCadastroEquipamentos() {

document.getElementById(
"cadastroEquipamentos"
).style.display =
"none";

}


/* =========================================================
ESCAPE HTML
========================================================= */

function escapeHtml(text) {

return String(
text || ""
)
.replace(
/&/g,
"&amp;"
)
.replace(
/</g,
"&lt;"
)
.replace(
/>/g,
"&gt;"
)
.replace(
/"/g,
"&quot;"
)
.replace(
/'/g,
"&#039;"
);

}


/* =========================================================
INICIAR
========================================================= */

async function iniciar() {

await carregarEquipamentos();

await carregarDados();

modoEdicao = false;

atualizarModoEdicao();

}

iniciar();
